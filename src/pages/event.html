<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>

  <body>
    <main class="event">
      <!-- Menu -->
      <div class="event__wrapper">
        <div class="menu">
          <div class="menu__header">
            <a href="main.html" class="menu__logo">
              <img src="../assets/icons/logo_full.svg" alt="logo full" />
            </a>
            <a href="main.html" class="menu__logo--mobile">
              <img src="../assets/icons/logo.svg" alt="logo" />
            </a>
            <button class="menu__toggle" aria-label="Toggle menu">
              <img src="../assets/icons/menu.svg" alt="burger menu" class="menu__burger--mobile" />
              <img src="../assets/icons/cross.svg" alt="cross" class="menu__cross--mobile hidden" />
            </button>
          </div>

          <nav class="menu__nav">
            <ul class="menu__list">
              <li class="nav__item">
                <a href="factories.html" class="nav__link">
                  <p>Фабрики</p>
                </a>
              </li>
              <li class="nav__item">
                <a href="people.html" class="nav__link">
                  <p>Люди</p>
                </a>
              </li>
              <li class="nav__item">
                <a href="leaders.html" class="nav__link">
                  <p>Руководители</p>
                </a>
              </li>
              <li class="nav__item">
                <a href="multimedia.html" class="nav__link">
                  <p>Мультимедиа</p>
                </a>
              </li>
            </ul>
          </nav>

          <div class="menu__footer">
            <div class="menu__search">
              <img src="../assets/icons/prime_search.svg" alt="search" />
              <p>Поиск</p>
            </div>
            <img src="../assets/icons/lines.svg" alt="lines" />
          </div>

          <!-- Menu Mobile -->
          <nav class="menu__nav--mobile">
            <img src="../assets/icons/line_menu.svg" alt="divider" class="menu__divider" />
            <ul class="menu__list--mobile">
              <li class="nav__item">
                <a href="factories.html" class="nav__link">
                  <p>Фабрики</p>
                </a>
              </li>
              <li class="nav__item">
                <a href="people.html" class="nav__link">
                  <p>Люди</p>
                </a>
              </li>
              <li class="nav__item">
                <a href="leaders.html" class="nav__link">
                  <p>Руководители</p>
                </a>
              </li>
              <li class="nav__item">
                <a href="event.html" class="nav__link">
                  <p>Мультимедиа</p>
                </a>
              </li>
            </ul>

            <div class="menu__footer--mobile">
              <div class="menu__search">
                <img src="../assets/icons/prime_search.svg" alt="search" />
                <p>Поиск</p>
              </div>
            </div>
          </nav>
        </div>
        <section class="event__content">
          <div class="event__container">
            <div class="event__left">
              <div class="event__header">
                <img src="../assets/icons/awards_logo.svg" alt="лого" class="event__logo" />
                <p class="event__title">
                  Сухонский<br />
                  картонно-бумажный комбинат
                </p>
              </div>
              <div class="event__images">
                <div class="event__image--main">
                  <img src="../assets/images/event1.jpg" alt="Бригада целлюлозного завода" />
                  <p class="event__image--year">1929 г.</p>
                  <p class="event__image--desc">Бригада целлюлозного завода</p>
                </div>
                <div class="event__image--back">
                  <img src="../assets/images/event2.jpg" alt="Рабочие целлюлозного завода" />
                  <p class="event__image--year">1926 г.</p>
                  <p class="event__image--desc">Рабочие целлюлозного завода</p>
                </div>
              </div>
            </div>
            <div class="event__center">
              <p class="event__years">1920-40-е</p>
            </div>
            <div class="event__right">
              <p class="event__year">1924</p>
            </div>
          </div>
          <div>GHBDTN</div>
        </section>
      </div>
    </main>

    <script src="../scripts/toggleMenu.js"></script>
  </body>
</html>
